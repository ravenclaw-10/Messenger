<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .chat-container {
        width: 900px;
        height: 90vh;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        border-radius: 25px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .header {
        height: 80px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .title {
        color: white;
        font-size: 24px;
        font-weight: 600;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ddd;
      }

      .dot {
        width: 12px;
        height: 12px;
        background: #00ff84;
        border-radius: 50%;
        box-shadow: 0 0 12px #00ff84;
      }

      .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .message {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        animation: fadeIn 0.3s ease;
      }

      .mine {
        justify-content: flex-end;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #6366f1;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        flex-shrink: 0;
      }

      .bubble {
        max-width: 70%;
        padding: 14px 18px;
        border-radius: 18px;
        color: white;
        word-break: break-word;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      .mine .bubble {
        background: linear-gradient(135deg, #6366f1, #7c3aed);
        border-bottom-right-radius: 5px;
      }

      .other .bubble {
        background: rgba(255, 255, 255, 0.15);
        border-bottom-left-radius: 5px;
      }

      .sender {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 5px;
      }

      .time {
        margin-top: 8px;
        font-size: 10px;
        opacity: 0.6;
        text-align: right;
      }

      .bottom {
        padding: 18px;
        background: rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .input-row {
        display: flex;
        gap: 15px;
      }

      input {
        border: none;
        outline: none;
        border-radius: 14px;
        padding: 15px;
        font-size: 15px;
      }

      #sender {
        width: 170px;
      }

      #message {
        flex: 1;
      }

      button {
        border: none;
        border-radius: 14px;
        background: #6366f1;
        color: white;
        padding: 0 30px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.25s;
      }

      button:hover {
        transform: translateY(-2px);
        background: #4f46e5;
      }

      ::-webkit-scrollbar {
        width: 7px;
      }

      ::-webkit-scrollbar-thumb {
        background: #666;
        border-radius: 10px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="header">
        <div class="title">Messenger</div>

        <div class="status">
          <div class="dot"></div>
          <span id="connectionStatus">Connected</span>
        </div>
      </div>

      <div class="chat-box" id="messages"></div>

      <div class="bottom">
        <div class="input-row">
          <input type="text" id="sender" placeholder="Your Name" />

          <input type="text" id="message" placeholder="Type a message..." />

          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <script>
      let stompClient = null;

      connect();

      function connect() {
        const socket = new SockJS("/chat");

        stompClient = Stomp.over(socket);

        stompClient.connect(
          {},
          function () {
            document.getElementById("connectionStatus").innerHTML = "Connected";

            stompClient.subscribe("/topic/messages", function (message) {
              const chat = JSON.parse(message.body);

              showMessage(chat);
            });
          },
          function () {
            document.getElementById("connectionStatus").innerHTML =
              "Disconnected";
          },
        );
      }

      function sendMessage() {
        const sender = document.getElementById("sender").value.trim();

        const content = document.getElementById("message").value.trim();

        if (sender === "" || content === "") return;

        stompClient.send(
          "/messenger/sendMessage",
          {},
          JSON.stringify({
            sender: sender,
            content: content,
          }),
        );

        document.getElementById("message").value = "";
      }

      function showMessage(chat) {
        const box = document.getElementById("messages");

        const currentUser = document.getElementById("sender").value.trim();

        const mine = currentUser === chat.sender;

        const row = document.createElement("div");

        row.className = "message " + (mine ? "mine" : "other");

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.innerHTML = chat.sender.charAt(0).toUpperCase();

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        const now = new Date();

        const time = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        bubble.innerHTML =
          "<div class='sender'>" +
          chat.sender +
          "</div>" +
          "<div>" +
          chat.content +
          "</div>" +
          "<div class='time'>" +
          time +
          "</div>";

        if (mine) {
          row.appendChild(bubble);
          row.appendChild(avatar);
        } else {
          row.appendChild(avatar);
          row.appendChild(bubble);
        }

        box.appendChild(row);

        box.scrollTop = box.scrollHeight;
      }

      document
        .getElementById("message")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") sendMessage();
        });
    </script>
  </body>
</html>
